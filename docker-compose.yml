name: northbot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: northbot
      POSTGRES_PASSWORD: northbot
      POSTGRES_DB: northbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northbot -d northbot"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Egress proxy: the only way out for agent computers; logs every connection as an event.
  egress:
    build:
      context: .
      dockerfile: docker/egress/Dockerfile
    environment:
      DATABASE_URL: postgres://northbot:northbot@postgres:5432/northbot
    depends_on:
      postgres:
        condition: service_healthy

  # Not a running service: "docker compose --profile images build" builds the agent computer image.
  agent-image:
    image: northbot/agent:dev
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    profiles: ["images"]

  server:
    # Root plus the Docker socket: the server creates and controls agent computers.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      DATABASE_URL: postgres://northbot:northbot@postgres:5432/northbot
      PORT: "3000"
      # Falls back to the built-in dev key (the server warns). install.sh writes a real one to .env.
      NORTHBOT_MASTER_KEY: ${NORTHBOT_MASTER_KEY:-ZGV2LW9ubHktbm9ydGhib3QtbWFzdGVyLWtleS0zMmI=}
      RP_ID: ${RP_ID:-localhost}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SANDBOX_DRIVER: ${SANDBOX_DRIVER:-docker}
      SANDBOX_IMAGE: northbot/agent:dev
      EGRESS_CONTAINER: northbot-egress-1
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      egress:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
